<svg width="840" height="220" viewBox="0 0 840 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CareLink light logo</title>
  <desc id="desc">CareLink continuous care logo for light backgrounds.</desc>
