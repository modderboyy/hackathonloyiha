    <linearGradient id="brand" x1="25" y1="20" x2="196" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F7BFF"/><stop offset="0.55" stop-color="#155EEF"/><stop offset="1" stop-color="#0E9384"/>
